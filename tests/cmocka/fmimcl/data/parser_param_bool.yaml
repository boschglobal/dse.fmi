---
kind: Stack
metadata:
  name: stack
spec:
  models:
    - name: fmu_inst
      uid: 42
      model:
        name: FMU
      channels:
        - name: signal
          alias: signal_channel
          selectors:
            channel: signal_vector
---
kind: Model
metadata:
  name: FMU
  annotations:
    mcl_adapter: 'fmi'
    mcl_version: '2.0'
    fmi_model_cosim: true
    fmi_model_version: '1.48'
    fmi_stepsize: '0.0001'
    fmi_guid: '{11111111-2222-3333-4444-555555555555}'
    fmi_resource_dir: 'dse/build/_out/fmimcl/example/simple/fmu/resources'
spec:
  runtime:
    dynlib:
      - os: linux
        arch: amd64
        path: examples/fmu/fmu/binaries/simple.so
---
kind: SignalGroup
metadata:
  name: PARAMETERS
  labels:
    model: FMU
    channel: signal_vector
spec:
  signals:
    - signal: bool_param_true
      annotations:
        fmi_variable_vref: 40
        fmi_variable_name: bool_param_true
        fmi_variable_type: Boolean
        fmi_variable_causality: parameter
        fmi_variable_start_value: 'true'
    - signal: bool_param_false
      annotations:
        fmi_variable_vref: 41
        fmi_variable_name: bool_param_false
        fmi_variable_type: Boolean
        fmi_variable_causality: parameter
        fmi_variable_start_value: 'false'
    - signal: bool_param_one
      annotations:
        fmi_variable_vref: 42
        fmi_variable_name: bool_param_one
        fmi_variable_type: Boolean
        fmi_variable_causality: parameter
        fmi_variable_start_value: '1'
